<!DOCTYPE html>
<!--
  01_form_post.html
  ------------------
  DEMO 1: The traditional way of sending POST data — an HTML form.
  The browser encodes every input as application/x-www-form-urlencoded
  and PHP automatically fills $_POST for you.

  Try it: open this file through your local server (not file://),
  fill it in, and submit — it will POST to 02_process_form_post.php.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 1 - Form POST</title>
  <meta name="description" content="This is the week 12 lesson">
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <h1>New Signup (Form POST)</h1>

  <form method="POST" action="process_form_post.php">
    <label>
      Name:
      <input type="text" name="name" required>
    </label>
    <br><br>
    <label>
      Email:
      <input type="email" name="email" required>
    </label>
    <br><br>
    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
